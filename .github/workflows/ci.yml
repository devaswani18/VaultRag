name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt pip-audit

      - name: Lint with ruff
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run tests with pytest
        run: |
          cd backend
          pytest

      - name: Run pip-audit supply chain scan
        run: |
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: |
          npm test -- --run

      - name: Run npm audit (high severity, non-blocking report)
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          if [ -d "infra" ] && [ -n "$(find infra -name '*.tf' 2>/dev/null)" ]; then
            terraform fmt -check -recursive infra
          else
            echo "No .tf files found in infra/ - check passed."
          fi

  terraform-security:
    name: Terraform Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          exit-code: '1'
          trivyignores: '.trivyignore'

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-mock:
    name: Evaluation Benchmark (Mock Mode)
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run hermetic eval benchmark
        run: |
          PYTHONPATH=backend/src python eval/run_eval.py --mode mock
