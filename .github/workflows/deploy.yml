name: Deploy (Dev)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    name: Backend & Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run backend tests with pytest
        run: |
          cd backend
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend dependencies & test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run

  deploy:
    name: Deploy to Dev
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda Function
        run: |
          bash backend/scripts/package.sh

      - name: Configure AWS Credentials (OIDC Apply Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-dev

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        working-directory: infra/envs/dev
        run: |
          terraform apply -auto-approve -var="lambda_zip_path=../../../backend/dist/lambda.zip"

      - name: Set up Node.js for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build Frontend Application
        working-directory: frontend
        run: |
          npm ci
          API_URL=$(cd ../infra/envs/dev && terraform output -raw api_url)
          CLIENT_ID=$(cd ../infra/envs/dev && terraform output -raw client_id)
          USER_POOL_ID=$(cd ../infra/envs/dev && terraform output -raw user_pool_id)
          VITE_API_URL="${API_URL}" \
          VITE_COGNITO_REGION="${{ vars.AWS_REGION }}" \
          VITE_COGNITO_CLIENT_ID="${CLIENT_ID}" \
          VITE_COGNITO_USER_POOL_ID="${USER_POOL_ID}" \
          npm run build

      - name: Deploy Frontend to S3 Static Bucket
        run: |
          SITE_BUCKET=$(cd infra/envs/dev && terraform output -raw site_bucket_name)
          aws s3 sync frontend/dist "s3://${SITE_BUCKET}" --delete

      - name: Invalidate CloudFront CDN Cache
        run: |
          DISTRIBUTION_ID=$(cd infra/envs/dev && terraform output -raw distribution_id)
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"

      - name: Smoke Test Deployed Endpoints
        working-directory: infra/envs/dev
        run: |
          API_URL="$(terraform output -raw api_url)"
          WEB_URL="$(terraform output -raw web_url)"
          echo "Testing API endpoint: ${API_URL}health"
          curl -fsS "${API_URL}health"
          echo "Testing Web frontend: ${WEB_URL}"
          curl -fsS "${WEB_URL}"
